name: calendar-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-calendar-ci-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install --upgrade platformio==6.1.19 clang-format==22.1.0

      - name: Check formatting of changed C/C++ files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RANGE="origin/$BASE_REF...HEAD"
            git fetch origin "$BASE_REF"
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$RANGE" |
              grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ino)$' || true)
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" &&
                  "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" HEAD |
              grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ino)$' || true)
          else
            mapfile -t FILES < <(git ls-files |
              grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ino)$' || true)
          fi

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No changed C/C++ files to format-check."
            exit 0
          fi

          printf 'Checking %s\n' "${FILES[@]}"
          clang-format -style=file --dry-run --Werror "${FILES[@]}"

      - name: Build Paper Calendar firmware
        run: python scripts/platformio_cli.py run -e TRMNL_7inch5_OG_DIY_Kit

      - name: Run calendar host tests
        run: python scripts/platformio_cli.py test -e native_calendar -v
