name: calendar-ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-calendar-ci-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install build tools
        run: pip install --upgrade platformio==6.1.19 clang-format==22.1.0

      - name: Check formatting of changed C/C++ files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF"
            python scripts/format_changed.py --check --base "origin/$BASE_REF...HEAD"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" &&
                  "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            python scripts/format_changed.py --check --base "$BEFORE_SHA" --head HEAD
          else
            python scripts/format_changed.py --check --base HEAD^ --head HEAD
          fi

      - name: Build Paper Calendar firmware
        run: python scripts/platformio_cli.py run -e TRMNL_7inch5_OG_DIY_Kit

      - name: Run calendar host tests
        run: python scripts/platformio_cli.py test -e native_calendar -v
