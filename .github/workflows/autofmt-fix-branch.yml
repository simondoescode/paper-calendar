name: autofmt-fix-branch

on:
  push:
    branches: ["fix/ota-ci-failures"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ota-ci-failures
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install clang-format 22
        run: pip install clang-format==22.1.0
      - name: Format sources
        run: CLANG_FORMAT=clang-format scripts/format.sh
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format OTA sources"
          git push origin HEAD:fix/ota-ci-failures
